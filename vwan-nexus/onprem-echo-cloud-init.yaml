#cloud-config
write_files:
  - path: /usr/local/sbin/echo-ip.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      # Simulated on-prem service: replies with the client address it sees.
      import socket
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      class H(BaseHTTPRequestHandler):
          def do_GET(self):
              body = f"client={self.client_address[0]} server={socket.gethostname()}\n".encode()
              self.send_response(200)
              self.send_header("Content-Type", "text/plain")
              self.send_header("Content-Length", str(len(body)))
              self.end_headers()
              self.wfile.write(body)

      ThreadingHTTPServer(("0.0.0.0", 80), H).serve_forever()
  - path: /etc/systemd/system/echo-ip.service
    content: |
      [Unit]
      Description=On-prem stand-in: HTTP echo of the client IP
      After=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /usr/local/sbin/echo-ip.py
      Restart=always
      RestartSec=2

      [Install]
      WantedBy=multi-user.target
runcmd:
  - systemctl daemon-reload
  - systemctl enable --now echo-ip.service
